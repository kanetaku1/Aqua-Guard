openapi: 3.1.0
info:
  title: AquaGuard API
  version: 0.1.0-draft
  description: |
    AquaGuard Web UI とバックエンドの間の API 契約（フロントエンド起案のドラフト）。

    参照ドキュメント（矛盾したら番号の小さい方が優先）：
    `frontend/docs/01〜08`、サンプル値は `frontend/prototype/mock_data.md`。
    各オペレーションの説明にある `Screens:` は 05_画面・機能要件書 の画面ID。

    ## 基本方針
    - **KPI・状態の判定はすべてバックエンドで計算する**（04 §3〜§7）。フロントは表示と書式化のみ。
      ABW / ADG / Size Uniformity は Pond 単位でのみ返し、Farm / Company の平均値は返さない（04 §4）。
    - **IoT データ**：センサー（3〜5分ごと）→ InfluxDB。バックエンドは **5分ごと** に InfluxDB を参照し、
      現在値・Alert 判定・集計を更新する。`x-refresh-interval-seconds: 300` のオペレーションは、
      フロントが5分ごとに再取得する（ライブ表示）。
    - **時刻**：`date-time` はすべて UTC（ISO 8601, `Z`）。表示は WIB（UTC+7）にフロントで変換する。
      `date`（記録日・Report 日付）は WIB の暦日。
    - **単位**：重量 kg、面積 ha、Biomass は kg（表示で t に変換）、比率は % の数値（88 = 88%）。
      Vibrio は ×10³ CFU/mL。
    - **値の種類**：Survival Rate と Biomass は Estimated、それ以外の生産KPIは Actual（04 §3）。
    - **RBAC はサーバー側で強制する**（02）。権限のないデータは返さない（403、範囲外の個別リソースは 404）。
      - Farms Manager：Company 配下の全 Farm。生のセンサー値・時系列、個々の記録、Draft の Report は返さない。
      - Technical Manager：担当 Farm とその Pond のみ。
      - System Administrator：`/admin/*` のみ。業務データは返さない。
    - **エラー**：`application/problem+json`（RFC 9457）＋ `code`・`fieldErrors`。
    - **一覧**：`page`（1始まり）・`pageSize` で取得し、`{ items, page, pageSize, total }` を返す。

    ## 未確定（バックエンドと要相談）
    - 認証方式：httpOnly Cookie のセッションを仮置き（無操作12時間でログアウト）。
    - Actuator の Safety Layer の判定ルールと、拒否理由のコード一覧。
    - Report 提出期限（Daily 当日18:00 / Weekly 翌週月曜、仮）。
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: AU-01〜03、自分の設定
  - name: Common
    description: Global Header（データ鮮度）
  - name: Farms
    description: Farm の状態・概況（FM-01〜03, TM-01）
  - name: Issues
    description: Risk / Issue（Alert の集約ビュー・FM 閲覧用）
  - name: Production
    description: 生産 KPI（バックエンドで計算）
  - name: Ponds
    description: Pond の一覧・詳細（TM）
  - name: Sensors
    description: センサー値・時系列（TM のみ）
  - name: Alerts
    description: Pond Alert の確認・対応（TM のみ）
  - name: Records
    description: 給餌・死亡・サンプリングの記録（TM のみ）
  - name: Actuators
    description: エアレーター・ポンプ（TM のみ）
  - name: Reports
    description: Daily / Weekly Report（FM 閲覧・TM 作成）
  - name: Admin
    description: ユーザー・マスタ・設定（SA のみ）

security:
  - sessionCookie: []

paths:
  # ───────────────────────── Auth ─────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: ログイン
      description: |
        Screens: AU-01。5回連続で失敗すると15分ロック。エラーはメール・パスワードのどちらが違うかを示さない。
        成功するとセッション Cookie を発行する。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: 'メールアドレスかパスワードが違う（`code: invalid_credentials`, `remainingAttempts` 付き）'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/LoginProblem' }
        '403':
          description: '無効化されたアカウント（`code: account_deactivated`）'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '423':
          description: 'ロック中（`code: account_locked`, `lockedUntil` 付き）'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/LoginProblem' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: ログアウト
      operationId: logout
      responses:
        '204': { description: ログアウトした }

  /auth/me:
    get:
      tags: [Auth]
      summary: ログイン中のユーザー
      description: アプリ起動時に呼び、Role に応じた最初の画面へ遷移する（AU-005）。未ログインは 401。
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      summary: 自分の表示言語を変更
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { $ref: '#/components/schemas/Language' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: パスワード再設定メールを依頼
      description: 'Screens: AU-02。アカウントの有無にかかわらず 202 を返す（リンクの有効期限1時間）。'
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: 受け付けた（登録されていればメールを送信） }

  /auth/password/tokens/{token}:
    get:
      tags: [Auth]
      summary: 招待・再設定リンクの検証
      description: 'Screens: AU-03。画面の表示内容（招待 / 再設定）を決めるために呼ぶ。'
      operationId: getPasswordToken
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 有効なリンク
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordToken' }
        '410':
          description: '期限切れ（`code: token_expired`。招待72時間 / 再設定1時間）'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/password/set:
    post:
      tags: [Auth]
      summary: パスワードを設定（招待・再設定）
      description: |
        Screens: AU-03。パスワードは10文字以上・英字と数字を含む。
        招待の場合は成功時にログイン済みとしてセッションを発行する。
      operationId: setPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 10 }
      responses:
        '200':
          description: 設定した（招待時はログイン済み）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '410':
          description: 期限切れ
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────── Common ─────────────────────────
  /sync-status:
    get:
      tags: [Common]
      summary: データ鮮度（ヘッダー表示）
      description: |
        Screens: 全業務画面の Global Header（SCR-COM-005）。ログインユーザーのスコープ（FM: 全 Farm / TM: 担当 Farm）で、
        InfluxDB から最後に参照できた時刻と品質を返す。SA は呼ばない。
      operationId: getSyncStatus
      x-refresh-interval-seconds: 300
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatus' }

  # ───────────────────────── Farms ─────────────────────────
  /farms:
    get:
      tags: [Farms]
      summary: Farm の状態一覧
      description: |
        Screens: FM-01 Farm Status, FM-02 Farm List。FM は全 Farm、TM は担当 Farm のみ。
        `counts` は絞り込み前の状態別 Farm 数。
      operationId: listFarms
      x-refresh-interval-seconds: 300
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Farm 名で検索 }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Severity' } }
        - { name: location, in: query, schema: { type: string } }
        - { name: hasIssues, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, counts]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FarmSummary' }
                  counts: { $ref: '#/components/schemas/SeverityCounts' }

  /farms/{farmId}:
    get:
      tags: [Farms]
      summary: Farm Detail（ヘッダー＋3観点の状態）
      description: 'Screens: FM-03 Farm Header / Farm Status。'
      operationId: getFarm
      x-refresh-interval-seconds: 300
      parameters:
        - $ref: '#/components/parameters/FarmId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /farms/{farmId}/status-trend:
    get:
      tags: [Farms]
      summary: Farm 状態の推移
      description: 'Screens: FM-03 Status Trend（直近14日）。日ごとの最も重い状態。'
      operationId: getFarmStatusTrend
      parameters:
        - $ref: '#/components/parameters/FarmId'
        - { name: days, in: query, schema: { type: integer, default: 14, maximum: 90 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [date, status]
                      properties:
                        date: { type: string, format: date }
                        status: { $ref: '#/components/schemas/Severity' }
                        waterQuality: { $ref: '#/components/schemas/Severity' }
                        growth: { $ref: '#/components/schemas/Severity' }
                        operations: { $ref: '#/components/schemas/Severity' }

  /farms/{farmId}/operational-status:
    get:
      tags: [Farms]
      summary: 現場の運用状態
      description: 'Screens: TM-01 Operational Status（エアレーター・ポンプ稼働、センサー接続、当日の給餌、次回サンプリング、発電機）。'
      operationId: getOperationalStatus
      x-refresh-interval-seconds: 300
      parameters:
        - $ref: '#/components/parameters/FarmId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalStatus' }

  /farms/{farmId}/report-status:
    get:
      tags: [Farms, Reports]
      summary: Report の提出状況
      description: 'Screens: TM-01 Report Status（当日の Daily、今週の Weekly、最終提出）。'
      operationId: getReportStatus
      parameters:
        - $ref: '#/components/parameters/FarmId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportStatusSummary' }

  # ───────────────────────── Issues (FM view of alerts) ─────────────────────────
  /issues:
    get:
      tags: [Issues]
      summary: Risk / Issue 一覧
      description: |
        Screens: FM-01 Risk / Issue（全 Farm）、FM-03 Risk / Issue（`farmId` 指定）。
        Alert から直接（ライブ）生成し、Report の提出を待たない。生のセンサー値は含めない（02 `**`）。
        既定の並びは Severity の重い順 → 継続時間の長い順。
      operationId: listIssues
      x-refresh-interval-seconds: 300
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/IssueState' }, description: 省略時は ongoing }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Issue' }

  /issues/{issueId}:
    get:
      tags: [Issues]
      summary: Issue の詳細（Alert Drawer・閲覧のみ）
      description: 'Screens: FM-03 Alert Drawer（`?issue=`）。概要、集約した傾向（文章）、対応状態、TM が実施した対応、関連 Report。'
      operationId: getIssue
      parameters:
        - { name: issueId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssueDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Production ─────────────────────────
  /production/summary:
    get:
      tags: [Production]
      summary: Company の生産状況
      description: 'Screens: FM-01 Production Status（総 Biomass〔Estimated・合計〕、目標より遅れている Pond 数）。平均 ABW は返さない。'
      operationId: getCompanyProduction
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyProduction' }

  /farms/{farmId}/production:
    get:
      tags: [Production]
      summary: Farm の生産 KPI と Pond Production Summary
      description: |
        Screens: FM-03 Production Status, FM-06 / TM-05 Production Status。
        `samplingDate` を指定するとその時点のサンプリングで計算した値（Weekly Report 用）。省略時は最新。
        Farm の SR・FCR は重み付き（04 §4）。
      operationId: getFarmProduction
      parameters:
        - $ref: '#/components/parameters/FarmId'
        - { name: samplingDate, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmProduction' }

  # ───────────────────────── Ponds (TM) ─────────────────────────
  /farms/{farmId}/ponds/water-quality:
    get:
      tags: [Ponds, Sensors]
      summary: Pond × 水質の現在値（TM ダッシュボード）
      description: 'Screens: TM-01 Pond Status。範囲外の値は `severity` で示す。`counts` は状態別の Pond 数。'
      operationId: listPondWaterQuality
      x-refresh-interval-seconds: 300
      parameters:
        - $ref: '#/components/parameters/FarmId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, counts, normalRanges]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PondWaterQualityRow' }
                  counts: { $ref: '#/components/schemas/SeverityCounts' }
                  normalRanges:
                    description: 表の下に注記する Normal の範囲
                    type: array
                    items: { $ref: '#/components/schemas/ParameterRange' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /farms/{farmId}/ponds:
    get:
      tags: [Ponds]
      summary: Pond 一覧（管理用）
      description: 'Screens: TM-02 Pond List（ABW・目標比・当日の給餌・死亡・エアレーター）。水質の現在値は含めない。'
      operationId: listPonds
      parameters:
        - $ref: '#/components/parameters/FarmId'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/Severity' } }
        - { name: alertState, in: query, schema: { $ref: '#/components/schemas/AlertState' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PondListRow' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ponds/{pondId}:
    get:
      tags: [Ponds]
      summary: Pond Detail ヘッダー
      description: 'Screens: TM-03 ヘッダー（Pond 名、Status、Farm、面積、放養日・DOC、放養尾数・ABW、最終更新）。'
      operationId: getPond
      x-refresh-interval-seconds: 300
      parameters:
        - $ref: '#/components/parameters/PondId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PondDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Sensors (TM) ─────────────────────────
  /ponds/{pondId}/sensors/current:
    get:
      tags: [Sensors]
      summary: 6項目の現在値
      description: 'Screens: TM-03 IoT / Water Quality（TM-PD-001 / 004）。閾値・センサー状態付き。'
      operationId: getCurrentSensorData
      x-refresh-interval-seconds: 300
      parameters:
        - $ref: '#/components/parameters/PondId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SensorReading' }

  /ponds/{pondId}/sensors/series:
    get:
      tags: [Sensors]
      summary: センサー時系列（グラフ）
      description: |
        Screens: TM-03 時系列グラフ（TM-PD-002）。期間に応じてバックエンドで間引く（`interval`）。
        閾値の帯は `thresholds` で返す。
      operationId: getSensorSeries
      x-refresh-interval-seconds: 300
      parameters:
        - $ref: '#/components/parameters/PondId'
        - { name: parameter, in: query, required: true, schema: { $ref: '#/components/schemas/SensorParameter' } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - name: interval
          in: query
          description: 集計間隔。省略時は期間から自動（24h → 5m, 7d → 1h, 30d → 6h）
          schema: { type: string, enum: [5m, 15m, 1h, 6h, 1d] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorSeries' }

  /ponds/{pondId}/sensors/history:
    get:
      tags: [Sensors]
      summary: 生データ（Historical Data）
      description: 'Screens: TM-03 Historical Data（TM-PD-003）。1行 = 1計測時刻の6項目。'
      operationId: getSensorHistory
      parameters:
        - $ref: '#/components/parameters/PondId'
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SensorHistoryRow' }

  /ponds/{pondId}/sensors/anomalies:
    get:
      tags: [Sensors]
      summary: 範囲外の区間（Anomalies）
      description: 'Screens: TM-03 Anomalies（TM-PD-005）。'
      operationId: listSensorAnomalies
      parameters:
        - $ref: '#/components/parameters/PondId'
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SensorAnomaly' }

  # ───────────────────────── Alerts (TM) ─────────────────────────
  /alerts:
    get:
      tags: [Alerts]
      summary: Pond Alert 一覧
      description: 'Screens: TM-01 Active Alerts（`state` 未解決）、TM-03 Alerts（`pondId` 指定）。'
      operationId: listAlerts
      x-refresh-interval-seconds: 300
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { name: pondId, in: query, schema: { type: string } }
        - name: state
          in: query
          description: 複数指定可。`open` は resolved 以外すべて
          schema:
            type: array
            items:
              type: string
              enum: [open, unacknowledged, acknowledged, in_progress, resolved]
          style: form
          explode: false
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Alert' }

  /alerts/{alertId}:
    get:
      tags: [Alerts]
      summary: Alert の詳細（Drawer）
      description: 'Screens: TM-03 Alert Drawer（TM-PD-007）。記録済みの対応を含む。'
      operationId: getAlert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /alerts/{alertId}/acknowledge:
    post:
      tags: [Alerts]
      summary: Alert を確認（Acknowledge）
      description: TM-PD-008。unacknowledged → acknowledged。
      operationId: acknowledgeAlert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertDetail' }
        '409': { $ref: '#/components/responses/Conflict' }

  /alerts/{alertId}/actions:
    post:
      tags: [Alerts]
      summary: 対応を記録（Record action）
      description: |
        TM-PD-022。最初の記録で in_progress になる。記録した対応は、その日の Daily Report の
        Actions Taken に自動で入る（source: alert_handling）。
      operationId: recordAlertAction
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertActionInput' }
      responses:
        '201':
          description: 記録した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertDetail' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /alerts/{alertId}/resolve:
    post:
      tags: [Alerts]
      summary: Alert を解決（Resolve）
      description: TM-PD-023。
      operationId: resolveAlert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertDetail' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── Records (TM) ─────────────────────────
  /ponds/{pondId}/feedings:
    get:
      tags: [Records]
      summary: 給餌の履歴
      description: TM-PD-011。
      operationId: listFeedings
      parameters:
        - $ref: '#/components/parameters/PondId'
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/FeedingRecord' }
    post:
      tags: [Records]
      summary: 給餌を記録
      description: TM-PD-010。日付は未来日を受け付けない（422）。
      operationId: createFeeding
      parameters:
        - $ref: '#/components/parameters/PondId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedingInput' }
      responses:
        '201':
          description: 記録した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedingRecord' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /feedings/{recordId}:
    patch:
      tags: [Records]
      summary: 給餌の記録を修正
      description: TM-PD-012。
      operationId: updateFeeding
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedingInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedingRecord' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /ponds/{pondId}/mortalities:
    get:
      tags: [Records]
      summary: 死亡の履歴
      description: TM-PD-014。
      operationId: listMortalities
      parameters:
        - $ref: '#/components/parameters/PondId'
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MortalityRecord' }
    post:
      tags: [Records]
      summary: 死亡を記録
      description: TM-PD-013。
      operationId: createMortality
      parameters:
        - $ref: '#/components/parameters/PondId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MortalityInput' }
      responses:
        '201':
          description: 記録した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MortalityRecord' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /mortalities/{recordId}:
    patch:
      tags: [Records]
      summary: 死亡の記録を修正
      description: TM-PD-015。
      operationId: updateMortality
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MortalityInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MortalityRecord' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /ponds/{pondId}/samplings:
    get:
      tags: [Records]
      summary: サンプリングの履歴＋成長グラフ
      description: TM-PD-017。ABW・ADG・目標比はバックエンドで計算。`growthCurve` は Pond の成長グラフ用。
      operationId: listSamplings
      parameters:
        - $ref: '#/components/parameters/PondId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, growthCurve]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SamplingRecord' }
                  growthCurve:
                    description: 目標成長曲線（DOC → 目標 ABW）
                    type: array
                    items: { $ref: '#/components/schemas/GrowthTargetPoint' }
    post:
      tags: [Records]
      summary: サンプリングを記録
      description: TM-PD-016。Laboratory は任意（未着なら空で保存し、後から PATCH で追記）。
      operationId: createSampling
      parameters:
        - $ref: '#/components/parameters/PondId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SamplingInput' }
      responses:
        '201':
          description: 記録した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplingRecord' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /samplings/{recordId}:
    patch:
      tags: [Records]
      summary: サンプリングの記録を修正・検査結果を追記
      description: TM-PD-018。
      operationId: updateSampling
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SamplingInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplingRecord' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /farms/{farmId}/samplings/batch:
    post:
      tags: [Records]
      summary: 週次サンプリングの一括記録
      description: |
        Screens: TM-02 Record weekly sampling（TM-P-005）。測定しない Pond は `entries` に含めない。
        同じ Pond・同じ日の記録があれば更新する。
      operationId: batchCreateSamplings
      parameters:
        - $ref: '#/components/parameters/FarmId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, entries]
              properties:
                date: { type: string, format: date }
                entries:
                  type: array
                  items:
                    allOf:
                      - type: object
                        required: [pondId]
                        properties:
                          pondId: { type: string }
                      - $ref: '#/components/schemas/SamplingMeasurement'
      responses:
        '200':
          description: 保存した
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SamplingRecord' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────── Actuators (TM) ─────────────────────────
  /ponds/{pondId}/actuators:
    get:
      tags: [Actuators]
      summary: 機器の状態
      description: 'Screens: TM-03 Actuator（TM-PD-019）。Safety Layer で禁止されている操作は `blockedCommands` に理由付きで返す。'
      operationId: listActuators
      x-refresh-interval-seconds: 300
      parameters:
        - $ref: '#/components/parameters/PondId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Actuator' }

  /actuators/{actuatorId}/commands:
    post:
      tags: [Actuators]
      summary: 機器を操作
      description: |
        TM-PD-020。Auto 中に手動操作すると Manual（override）になる。
        Safety Layer が拒否した場合は 409（`code: safety_blocked`, `detail` に理由）。
      operationId: sendActuatorCommand
      parameters:
        - { name: actuatorId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { $ref: '#/components/schemas/ActuatorCommand' }
      responses:
        '202':
          description: 受け付けた（反映は状態の再取得で確認）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Actuator' }
        '409': { $ref: '#/components/responses/Conflict' }

  /ponds/{pondId}/actuator-logs:
    get:
      tags: [Actuators]
      summary: 操作履歴
      description: 'TM-PD-021。Daily Report の Actions Taken にも自動で入る（source: actuator_log）。'
      operationId: listActuatorLogs
      parameters:
        - $ref: '#/components/parameters/PondId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ActuatorLog' }

  # ───────────────────────── Reports ─────────────────────────
  /reports:
    get:
      tags: [Reports]
      summary: Report 一覧
      description: |
        Screens: FM-04 Report List、TM-04 / TM-05 History。
        FM には submitted のみを返す（`status=draft` を指定しても空）。TM は担当 Farm のみ。
      operationId: listReports
      parameters:
        - { name: type, in: query, required: true, schema: { $ref: '#/components/schemas/ReportType' } }
        - { name: farmId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReportState' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ReportListItem' }

  /reports/daily:
    post:
      tags: [Reports]
      summary: Daily Report の下書きを作成
      description: |
        TM-R-001。記録・Alert・Actuator ログから自動で集めた内容で下書きを作る。
        同じ Farm・日付の Report が既にあれば 409（`existingReportId` 付き）。
      operationId: createDailyReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [farmId, date]
              properties:
                farmId: { type: string }
                date: { type: string, format: date }
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReport' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reports/daily/{reportId}:
    get:
      tags: [Reports]
      summary: Daily Report
      description: |
        Screens: FM-05、TM-04。自動で集めた値は読み取り専用（`source` 付き）。
        Draft の場合、自動の値は取得のたびに最新の記録から作り直す。FM が Draft を取得すると 404。
      operationId: getDailyReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReport' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Reports]
      summary: Daily Report の下書きを保存（Save Draft）
      description: TM-R-002。TM が入力する項目のみ。Submitted は 409。
      operationId: updateDailyReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailyReportInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyReport' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /reports/weekly:
    post:
      tags: [Reports]
      summary: Weekly Report の下書きを作成
      description: TM-R-005。`weekStart` は月曜。週の水質傾向・生産 KPI・Alert を自動集計する。
      operationId: createWeeklyReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [farmId, weekStart]
              properties:
                farmId: { type: string }
                weekStart: { type: string, format: date }
      responses:
        '201':
          description: 作成した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReport' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reports/weekly/{reportId}:
    get:
      tags: [Reports]
      summary: Weekly Report
      description: 'Screens: FM-06、TM-05。'
      operationId: getWeeklyReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyReport' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Reports]
      summary: Weekly Report の下書きを保存
      description: TM-R-006。
      operationId: updateWeeklyReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeeklyReportInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
