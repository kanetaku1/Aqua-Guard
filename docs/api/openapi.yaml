    post:
      tags: [Reports]
      summary: Report を提出
      description: |
        TM-R-003 / 007。Draft → Submitted。必須項目（Daily：Weather・Summary、Weekly：Weekly Technical Summary）が
        未入力なら 422。提出後は閲覧のみ。
      operationId: submitReport
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: 提出した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportListItem' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────── Admin (SA) ─────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: ユーザー一覧
      description: 'Screens: AD-01（AD-U-001）。'
      operationId: adminListUsers
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 名前・メールで検索 }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: farmId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminUser' }
    post:
      tags: [Admin]
      summary: ユーザーを招待
      description: AD-U-002。招待メールを送る（有効期限72時間）。TM は `farmId` 必須、FM・SA は指定しない。
      operationId: adminInviteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
                farmId: { type: [string, 'null'] }
                language: { $ref: '#/components/schemas/Language' }
      responses:
        '201':
          description: 招待した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '409':
          description: '同じメールアドレスのユーザーがいる（`code: email_taken`）'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/users/{userId}:
    get:
      tags: [Admin]
      summary: ユーザーの詳細
      operationId: adminGetUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
    patch:
      tags: [Admin]
      summary: Role・担当 Farm・言語を変更
      description: AD-U-003。自分自身と最後の SA の Role は変更できない（409）。
      operationId: adminUpdateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
                farmId: { type: [string, 'null'] }
                language: { $ref: '#/components/schemas/Language' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/users/{userId}/resend-invitation:
    post:
      tags: [Admin]
      summary: 招待を再送
      description: AD-U-004。Invited のユーザーのみ。
      operationId: adminResendInvitation
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '202': { description: 再送した }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/users/{userId}/send-password-reset:
    post:
      tags: [Admin]
      summary: パスワード再設定メールを送る
      description: AD-U-004。
      operationId: adminSendPasswordReset
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '202': { description: 送信した }

  /admin/users/{userId}/deactivate:
    post:
      tags: [Admin]
      summary: 無効化
      description: AD-U-005。ログイン不可になるが記録は残る。自分自身と最後の SA は 409。
      operationId: adminDeactivateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/users/{userId}/reactivate:
    post:
      tags: [Admin]
      summary: 再有効化
      description: AD-U-005。
      operationId: adminReactivateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }

  /admin/farms:
    get:
      tags: [Admin]
      summary: Farm マスタ一覧
      description: 'Screens: AD-02（AD-F-001）。業務データ（状態・KPI）は含めない。'
      operationId: adminListFarms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminFarm' }
    post:
      tags: [Admin]
      summary: Farm を登録
      description: AD-F-002。
      operationId: adminCreateFarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminFarmInput' }
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFarm' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/farms/{farmId}:
    get:
      tags: [Admin]
      summary: Farm マスタ
      description: 'Screens: AD-03 ヘッダー・Farm Info。'
      operationId: adminGetFarm
      parameters:
        - $ref: '#/components/parameters/FarmId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFarm' }
    patch:
      tags: [Admin]
      summary: Farm マスタを更新
      description: AD-F-003。
      operationId: adminUpdateFarm
      parameters:
        - $ref: '#/components/parameters/FarmId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminFarmInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFarm' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/farms/{farmId}/ponds:
    get:
      tags: [Admin]
      summary: Pond マスタ一覧
      description: 'Screens: AD-03 Ponds（AD-F-004）。'
      operationId: adminListPonds
      parameters:
        - $ref: '#/components/parameters/FarmId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminPond' }
    post:
      tags: [Admin]
      summary: Pond を登録
      operationId: adminCreatePond
      parameters:
        - $ref: '#/components/parameters/FarmId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPondInput' }
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPond' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/ponds/{pondId}:
    patch:
      tags: [Admin]
      summary: Pond マスタを更新
      operationId: adminUpdatePond
      parameters:
        - $ref: '#/components/parameters/PondId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPondInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPond' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/farms/{farmId}/devices:
    get:
      tags: [Admin]
      summary: 機器一覧
      description: 'Screens: AD-03 Devices（AD-F-005）。'
      operationId: adminListDevices
      parameters:
        - $ref: '#/components/parameters/FarmId'
        - { name: pondId, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/DeviceType' } }
        - { name: connection, in: query, schema: { $ref: '#/components/schemas/Connection' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminDevice' }
    post:
      tags: [Admin]
      summary: 機器を登録・割り当て
      operationId: adminCreateDevice
      parameters:
        - $ref: '#/components/parameters/FarmId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminDeviceInput' }
      responses:
        '201':
          description: 登録した
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDevice' }
        '409':
          description: '同じ Device ID がある（`code: device_id_taken`）'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/devices/{deviceId}:
    patch:
      tags: [Admin]
      summary: 機器の割り当てを変更
      operationId: adminUpdateDevice
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminDeviceInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDevice' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/settings/thresholds:
    get:
      tags: [Admin]
      summary: 閾値
      description: |
        Screens: AD-04 Thresholds（AD-S-001）。`farmId` 省略時は全 Farm 共通の初期値、指定時はその Farm の上書き
        （上書きのない項目は `inherited: true` で初期値を返す）。
      operationId: adminGetThresholds
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThresholdSettings' }
    put:
      tags: [Admin]
      summary: 閾値を保存
      description: 境界値の順序が矛盾する場合は 422（欄ごとの `fieldErrors`）。保存以降の判定にのみ適用する。
      operationId: adminPutThresholds
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Threshold' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThresholdSettings' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/settings/growth-targets:
    get:
      tags: [Admin]
      summary: 目標成長曲線
      description: 'Screens: AD-04 Growth Targets（AD-S-002）。'
      operationId: adminGetGrowthTargets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthTargetSettings' }
    put:
      tags: [Admin]
      summary: 目標成長曲線を保存
      operationId: adminPutGrowthTargets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points, onTrackBandPct]
              properties:
                points:
                  type: array
                  items: { $ref: '#/components/schemas/GrowthTargetPoint' }
                onTrackBandPct: { type: number, example: 5 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthTargetSettings' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/settings/rules:
    get:
      tags: [Admin]
      summary: 運用ルール
      description: 'Screens: AD-04 Rules（AD-S-003）。'
      operationId: adminGetRules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSettings' }
    put:
      tags: [Admin]
      summary: 運用ルールを保存
      operationId: adminPutRules
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleSettingsInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSettings' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aquaguard_session
      description: httpOnly・Secure・SameSite=Lax のセッション Cookie（仮）。無操作12時間で失効。

  parameters:
    FarmId: { name: farmId, in: path, required: true, schema: { type: string, example: farm-a } }
    PondId: { name: pondId, in: path, required: true, schema: { type: string, example: farm-a-pond-02 } }
    AlertId: { name: alertId, in: path, required: true, schema: { type: string, example: ALT-1042 } }
    ReportId: { name: reportId, in: path, required: true, schema: { type: string } }
    RecordId: { name: recordId, in: path, required: true, schema: { type: string } }
    UserId: { name: userId, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }

  responses:
    Unauthorized:
      description: 未ログイン・セッション切れ（フロントはログイン画面へ。ログイン後は直前の画面へ戻る）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Role の権限外
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 存在しない、またはスコープ外
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: 状態が操作と矛盾する（例：提出済みの Report を編集、Safety Layer の拒否、最後の SA の無効化）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: 入力エラー（欄ごとのエラーは `fieldErrors`）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ── 共通 ──
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: 機械判定用のコード（例 invalid_credentials, report_submitted, safety_blocked, last_admin）
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, description: 'JSON Pointer 風のパス（例 items/0/warningLow）' }
              message: { type: string }
        existingReportId: { type: string }

    LoginProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            remainingAttempts: { type: integer }
            lockedUntil: { type: string, format: date-time }

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    Severity:
      type: string
      description: 状態・重大度（Normal / Attention / Warning / Critical）
      enum: [normal, attention, warning, critical]

    SeverityCounts:
      type: object
      required: [normal, attention, warning, critical]
      properties:
        normal: { type: integer }
        attention: { type: integer }
        warning: { type: integer }
        critical: { type: integer }

    Trend:
      type: string
      enum: [increasing, decreasing, stable]

    DataQuality:
      type: string
      description: 最終取得から15分以内 live、15分超 delayed、60分超 offline、実績なし no_data（04 §7、閾値は Rules で変更可）
      enum: [live, delayed, offline, no_data]

    Language:
      type: string
      enum: [en, id]

    Role:
      type: string
      enum: [farms_manager, technical_manager, system_administrator]

    UserStatus:
      type: string
      enum: [invited, active, deactivated]

    SensorParameter:
      type: string
      enum: [do, ph, temperature, tds, turbidity, water_level]

    LabParameter:
      type: string
      enum: [tan, no2, vibrio, alkalinity]

    GrowthJudgement:
      type: string
      description: 目標比 ≤ −5% behind、≥ +5% ahead、それ以外 on_track（幅は Growth Targets で変更可）
      enum: [behind, on_track, ahead]

    AlertState:
      type: string
      enum: [unacknowledged, acknowledged, in_progress, resolved]

    IssueState:
      type: string
      enum: [ongoing, resolved]

    ReportType:
      type: string
      enum: [daily, weekly]

    ReportState:
      type: string
      enum: [draft, submitted]

    Appetite:
      type: string
      enum: [good, reduced, poor]

    TrayCondition:
      type: string
      enum: [clean, leftover]

    HealthObservation:
      type: string
      enum: [reduced_appetite, abnormal_swimming, gill_discoloration, shell_condition, other]

    ActionType:
      type: string
      enum: [increased_aeration, water_exchange, equipment_inspection, water_treatment, other]

    DeviceType:
      type: string
      enum: [sensor, aerator, pump]

    Connection:
      type: string
      enum: [online, offline]

    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    FarmRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, example: Farm A }

    PondRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string, example: Pond 02 }

    ReportRef:
      type: object
      required: [id, type, label]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/ReportType' }
        label: { type: string, example: Daily 28 Sep }
        date: { type: string, format: date }
        weekStart: { type: string, format: date }

    # ── Auth / Common ──
    Me:
      type: object
      required: [id, name, email, role, language]
      properties:
        id: { type: string }
        name: { type: string, example: Sari Wijaya }
        initials: { type: string, example: SW }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        language: { $ref: '#/components/schemas/Language' }
        company: { type: string, example: Nusantara Shrimp Co. }
        farm:
          description: TM の担当 Farm（FM・SA は null）
          oneOf:
            - $ref: '#/components/schemas/FarmRef'
            - type: 'null'

    PasswordToken:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [invite, reset] }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        farm:
          oneOf:
            - $ref: '#/components/schemas/FarmRef'
            - type: 'null'
        expiresAt: { type: string, format: date-time }

    SyncStatus:
      type: object
      required: [quality]
      properties:
        quality: { $ref: '#/components/schemas/DataQuality' }
        syncedAt:
          type: [string, 'null']
          format: date-time
          description: バックエンドが InfluxDB を最後に参照できた時刻
        nextSyncAt: { type: string, format: date-time }

    # ── Farms ──
    StatusAspect:
      type: object
      description: Water quality / Growth / Operations の1観点
      required: [status, fact]
      properties:
        status: { $ref: '#/components/schemas/Severity' }
        count: { type: integer, description: 該当 Pond 数（範囲外 / 目標より遅れ / 問題のある設備等） }
        fact: { type: string, description: '根拠の事実（例 "2 of 8 Ponds out of range"）' }

    FarmSummary:
      type: object
      required: [id, name, location, pondCount, status, mainReason, waterQuality, growth, operations, openIssues]
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string, example: East Java, Indonesia }
        pondCount: { type: integer }
        status:
          allOf: [{ $ref: '#/components/schemas/Severity' }]
          description: 3観点のうち最も重いもの（Overall という別の状態は持たない）
        mainReason: { type: string, description: 状態の根拠を1文で }
        waterQuality: { $ref: '#/components/schemas/StatusAspect' }
        growth: { $ref: '#/components/schemas/StatusAspect' }
        operations: { $ref: '#/components/schemas/StatusAspect' }
        openIssues: { type: integer }

    FarmDetail:
      allOf:
        - $ref: '#/components/schemas/FarmSummary'
        - type: object
          required: [technicalManagers, docRange, updatedAt]
          properties:
            technicalManagers:
              type: array
              items: { $ref: '#/components/schemas/UserRef' }
            docRange:
              type: object
              properties:
                min: { type: integer }
                max: { type: integer }
            updatedAt: { type: string, format: date-time }
            statusSentence: { type: string, description: Farm の状態がどの観点から来ているかの1文 }
            latestReport:
              oneOf:
                - $ref: '#/components/schemas/ReportRef'
                - type: 'null'

    OperationalStatus:
      type: object
      properties:
        aerators: { $ref: '#/components/schemas/OnCount' }
        pumps: { $ref: '#/components/schemas/OnCount' }
        sensors:
          type: object
          properties:
            online: { type: integer }
            total: { type: integer }
            offline:
              type: array
              items:
                type: object
                properties:
                  deviceId: { type: string }
                  pond: { $ref: '#/components/schemas/PondRef' }
                  parameter: { $ref: '#/components/schemas/SensorParameter' }
                  since: { type: string, format: date-time }
        feedingToday:
          type: object
          properties:
            totalKg: { type: number }
            pondsRecorded: { type: integer }
            pondsTotal: { type: integer }
        nextSampling: { type: [string, 'null'], format: date }
        generator:
          type: object
          properties:
            state: { type: string, enum: [standby, running, fault] }
            lastTestedAt: { type: string, format: date-time }

    OnCount:
      type: object
      required: ['on', total]
      properties:
        'on': { type: integer }
        total: { type: integer }

    ReportStatusSummary:
      type: object
      properties:
        dailyToday: { $ref: '#/components/schemas/ReportStatusItem' }
        weeklyThisWeek: { $ref: '#/components/schemas/ReportStatusItem' }
        lastSubmitted:
          oneOf:
            - $ref: '#/components/schemas/ReportListItem'
            - type: 'null'

    ReportStatusItem:
      type: object
      properties:
        reportId: { type: [string, 'null'], description: 未作成なら null }
        state:
          type: string
          enum: [not_started, draft, submitted, overdue]
        dueAt: { type: string, format: date-time }

    # ── Issues ──
    Issue:
      type: object
      description: FM 向けの集約ビュー。生のセンサー値は含めない
      required: [id, farm, pond, issueType, parameter, trend, severity, handling, state, since]
      properties:
        id: { type: string, example: ISS-218 }
        farm: { $ref: '#/components/schemas/FarmRef' }
        pond: { $ref: '#/components/schemas/PondRef' }
        issueType: { type: string, enum: [water_quality, mortality, equipment, sensor] }
        parameter: { type: string, description: 'SensorParameter または mortality 等', example: do }
        trend: { $ref: '#/components/schemas/Trend' }
        severity: { $ref: '#/components/schemas/Severity' }
        handling: { $ref: '#/components/schemas/AlertState' }
        state: { $ref: '#/components/schemas/IssueState' }
        since: { type: string, format: date-time, description: 継続時間はフロントで now − since }
        resolvedAt: { type: [string, 'null'], format: date-time }

    IssueDetail:
      allOf:
        - $ref: '#/components/schemas/Issue'
        - type: object
          properties:
            summary: { type: string }
            trendDescription: { type: string, description: 集約した傾向（文章） }
            actions:
              type: array
              description: TM が実施した対応
              items: { $ref: '#/components/schemas/AlertAction' }
            relatedReports:
              type: array
              items: { $ref: '#/components/schemas/ReportRef' }

    # ── Production ──
    CompanyProduction:
      type: object
      required: [biomassKg, pondsBehind, pondsTotal, latestSamplingDate]
      properties:
        biomassKg: { type: number, description: Estimated・全 Pond の合計 }
        pondsBehind: { type: integer }
        pondsTotal: { type: integer }
        latestSamplingDate: { type: string, format: date }
        previous:
          type: object
          description: 前週の値（比較表示用）
          properties:
            biomassKg: { type: number }
            pondsBehind: { type: integer }

    FarmProduction:
      type: object
      required: [samplingDate, kpis, ponds, growthCurve]
      properties:
        samplingDate: { type: string, format: date }
        kpis:
          type: object
          required: [biomassKg, survivalRatePct, fcr, growthDistribution]
          properties:
            biomassKg: { type: number, description: Estimated・合計 }
            survivalRatePct: { type: number, description: 'Estimated・重み付き（Σ推定生存尾数 ÷ Σ放養尾数）' }
            fcr: { type: number, description: 重み付き（Σ給餌量 ÷ Σ増重量） }
            growthDistribution:
              type: object
              required: [behind, onTrack, ahead]
              properties:
                behind: { type: integer }
                onTrack: { type: integer }
                ahead: { type: integer }
            previous:
              type: object
              description: 前回サンプリング時の値
              properties:
                biomassKg: { type: number }
                survivalRatePct: { type: number }
                fcr: { type: number }
        ponds:
          type: array
          items: { $ref: '#/components/schemas/PondProduction' }
        growthCurve:
          type: array
          items: { $ref: '#/components/schemas/GrowthTargetPoint' }

    PondProduction:
      type: object
      required: [pond, doc]
      properties:
        pond: { $ref: '#/components/schemas/PondRef' }
        areaHa: { type: number }
        stockedOn: { type: string, format: date }
        stockedPl: { type: integer }
        doc: { type: integer }
        abwG: { type: [number, 'null'] }
        targetAbwG: { type: [number, 'null'] }
        vsTargetPct: { type: [number, 'null'] }
        growth:
          oneOf:
            - $ref: '#/components/schemas/GrowthJudgement'
            - type: 'null'
        adgGPerDay: { type: [number, 'null'] }
        survivalRatePct: { type: [number, 'null'], description: Estimated }
        fcr: { type: [number, 'null'] }
        biomassKg: { type: [number, 'null'], description: Estimated }
        sizeUniformityPct: { type: [number, 'null'] }

    GrowthTargetPoint:
      type: object
      required: [doc, targetAbwG]
      properties:
        doc: { type: integer }
        targetAbwG: { type: number }

    # ── Ponds / Sensors ──
    SensorValue:
      type: object
      required: [value, severity, quality]
      properties:
        value: { type: [number, 'null'], description: offline / no_data の場合 null }
        severity: { $ref: '#/components/schemas/Severity' }
        quality: { $ref: '#/components/schemas/DataQuality' }
        measuredAt: { type: [string, 'null'], format: date-time }

    PondWaterQualityRow:
      type: object
      required: [pond, status, values, openAlerts]
      properties:
        pond: { $ref: '#/components/schemas/PondRef' }
        status: { $ref: '#/components/schemas/Severity' }
        values:
          type: object
          description: キーは SensorParameter
          properties:
            do: { $ref: '#/components/schemas/SensorValue' }
            ph: { $ref: '#/components/schemas/SensorValue' }
            temperature: { $ref: '#/components/schemas/SensorValue' }
            tds: { $ref: '#/components/schemas/SensorValue' }
            turbidity: { $ref: '#/components/schemas/SensorValue' }
            water_level: { $ref: '#/components/schemas/SensorValue' }
        openAlerts: { type: integer }
        worstAlertState:
          oneOf:
            - $ref: '#/components/schemas/AlertState'
            - type: 'null'

    ParameterRange:
      type: object
      required: [parameter, unit]
      properties:
        parameter: { $ref: '#/components/schemas/SensorParameter' }
        unit: { type: string, example: mg/L }
        normalMin: { type: [number, 'null'] }
        normalMax: { type: [number, 'null'] }

    PondListRow:
      type: object
      required: [pond, status]
      properties:
        pond: { $ref: '#/components/schemas/PondRef' }
        areaHa: { type: number }
        doc: { type: integer }
        status: { $ref: '#/components/schemas/Severity' }
        openAlerts: { type: integer }
        worstAlertState:
          oneOf:
            - $ref: '#/components/schemas/AlertState'
            - type: 'null'
        abwG: { type: [number, 'null'], description: 最新サンプリング }
        vsTargetPct: { type: [number, 'null'] }
        growth:
          oneOf:
            - $ref: '#/components/schemas/GrowthJudgement'
            - type: 'null'
        feedTodayKg: { type: [number, 'null'] }
        feedRoundsToday: { type: integer }
        mortalityTodayPcs: { type: [integer, 'null'] }
        aerators: { $ref: '#/components/schemas/OnCount' }

    PondDetail:
      type: object
      required: [pond, farm, status, updatedAt]
      properties:
        pond: { $ref: '#/components/schemas/PondRef' }
        farm: { $ref: '#/components/schemas/FarmRef' }
        status: { $ref: '#/components/schemas/Severity' }
        areaHa: { type: number }
        stockedOn: { type: [string, 'null'], format: date }
        doc: { type: [integer, 'null'] }
        stockedPl: { type: [integer, 'null'] }
        abwG: { type: [number, 'null'] }
        updatedAt: { type: string, format: date-time }

    Threshold:
      type: object
      description: 境界値（04 §6.2）。Normal は両側の Attention 境界の間として自動で決まる。使わない値は null
      required: [parameter]
      properties:
        parameter:
          oneOf:
            - $ref: '#/components/schemas/SensorParameter'
            - $ref: '#/components/schemas/LabParameter'
        unit: { type: string }
        criticalLow: { type: [number, 'null'] }
        warningLow: { type: [number, 'null'] }
        attentionLow: { type: [number, 'null'] }
        attentionHigh: { type: [number, 'null'] }
        warningHigh: { type: [number, 'null'] }
        criticalHigh: { type: [number, 'null'] }
        inherited: { type: boolean, readOnly: true, description: Farm の上書きがなく初期値を使っている }

    SensorReading:
      allOf:
        - $ref: '#/components/schemas/SensorValue'
        - type: object
          required: [parameter, unit, threshold]
          properties:
            parameter: { $ref: '#/components/schemas/SensorParameter' }
            unit: { type: string }
            deviceId: { type: string, example: A-P02-DO }
            threshold: { $ref: '#/components/schemas/Threshold' }

    SensorSeries:
      type: object
      required: [parameter, unit, interval, points, threshold]
      properties:
        parameter: { $ref: '#/components/schemas/SensorParameter' }
        unit: { type: string }
        interval: { type: string }
        points:
          type: array
          items:
            type: object
            required: [t]
            properties:
              t: { type: string, format: date-time }
              avg: { type: [number, 'null'], description: 欠損区間は null }
              min: { type: [number, 'null'] }
              max: { type: [number, 'null'] }
        threshold: { $ref: '#/components/schemas/Threshold' }

    SensorHistoryRow:
      type: object
      required: [measuredAt]
      properties:
        measuredAt: { type: string, format: date-time }
        do: { type: [number, 'null'] }
        ph: { type: [number, 'null'] }
        temperature: { type: [number, 'null'] }
        tds: { type: [number, 'null'] }
        turbidity: { type: [number, 'null'] }
        water_level: { type: [number, 'null'] }

    SensorAnomaly:
      type: object
      required: [parameter, severity, startedAt]
      properties:
        parameter: { $ref: '#/components/schemas/SensorParameter' }
        severity: { $ref: '#/components/schemas/Severity' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        extremeValue: { type: number, description: 区間中の最も外れた値 }
        alertId: { type: [string, 'null'] }

    # ── Alerts ──
    Alert:
      type: object
      required: [id, pond, title, parameter, severity, state, occurredAt]
      properties:
        id: { type: string, example: ALT-1042 }
        pond: { $ref: '#/components/schemas/PondRef' }
        title: { type: string, example: DO below threshold (4.1 mg/L < 4.5) }
        parameter: { type: string, description: SensorParameter、または sensor_offline }
        severity: { $ref: '#/components/schemas/Severity' }
        state: { $ref: '#/components/schemas/AlertState' }
        value: { type: [number, 'null'] }
        thresholdValue: { type: [number, 'null'] }
        occurredAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }

    AlertDetail:
      allOf:
        - $ref: '#/components/schemas/Alert'
        - type: object
          properties:
            acknowledgedAt: { type: [string, 'null'], format: date-time }
            acknowledgedBy:
              oneOf:
                - $ref: '#/components/schemas/UserRef'
                - type: 'null'
            actions:
              type: array
              items: { $ref: '#/components/schemas/AlertAction' }

    AlertActionInput:
      type: object
      required: [performedAt, type]
      properties:
        performedAt: { type: string, format: date-time }
        type: { $ref: '#/components/schemas/ActionType' }
        note: { type: string, maxLength: 1000 }

    AlertAction:
      allOf:
        - $ref: '#/components/schemas/AlertActionInput'
        - type: object
          required: [id, recordedBy]
          properties:
            id: { type: string }
            recordedBy: { $ref: '#/components/schemas/UserRef' }

    # ── Records ──
    FeedingInput:
      type: object
      required: [date, amountKg, rounds, feedType]
      properties:
        date: { type: string, format: date }
        amountKg: { type: number, minimum: 0 }
        rounds: { type: integer, minimum: 0 }
        feedType: { type: string, example: Grower 2 }
        appetite: { $ref: '#/components/schemas/Appetite' }
        tray: { $ref: '#/components/schemas/TrayCondition' }
        note: { type: string }

    FeedingRecord:
      allOf:
        - $ref: '#/components/schemas/FeedingInput'
        - $ref: '#/components/schemas/RecordMeta'

    MortalityInput:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer, minimum: 0 }
        weightKg: { type: number, minimum: 0 }
        abnormal: { type: boolean, description: 異常な死亡の観察 }
        note: { type: string }

    MortalityRecord:
      allOf:
        - $ref: '#/components/schemas/MortalityInput'
        - $ref: '#/components/schemas/RecordMeta'

    SamplingMeasurement:
      type: object
      properties:
        sampleCount: { type: [integer, 'null'], minimum: 1 }
        sampleWeightG: { type: [number, 'null'], minimum: 0 }
        tan: { type: [number, 'null'], description: mg/L }
        no2: { type: [number, 'null'], description: mg/L }
        vibrio: { type: [number, 'null'], description: ×10³ CFU/mL }
        alkalinity: { type: [number, 'null'], description: mg/L }

    SamplingInput:
      allOf:
        - type: object
          required: [date]
          properties:
            date: { type: string, format: date }
        - $ref: '#/components/schemas/SamplingMeasurement'

    SamplingRecord:
      allOf:
        - $ref: '#/components/schemas/SamplingInput'
        - $ref: '#/components/schemas/RecordMeta'
        - type: object
          description: バックエンドで計算する値
          properties:
            doc: { type: integer }
            abwG: { type: [number, 'null'] }
            adgGPerDay: { type: [number, 'null'] }
            targetAbwG: { type: [number, 'null'] }
            vsTargetPct: { type: [number, 'null'] }
            growth:
              oneOf:
                - $ref: '#/components/schemas/GrowthJudgement'
                - type: 'null'
            labPending: { type: boolean, description: Laboratory が未着 }

    RecordMeta:
      type: object
      required: [id, pondId, recordedBy, updatedAt]
      properties:
        id: { type: string }
        pondId: { type: string }
        recordedBy: { $ref: '#/components/schemas/UserRef' }
        updatedAt: { type: string, format: date-time }

    # ── Actuators ──
    ActuatorCommand:
      type: string
      enum: [turn_on, turn_off, set_auto]

    Actuator:
      type: object
      required: [id, type, name, state, mode, connection]
      properties:
        id: { type: string, example: A-P02-AER1 }
        type: { type: string, enum: [aerator, pump] }
        name: { type: string, example: Aerator 1 }
        state: { type: string, enum: ['on', 'off', fault] }
        mode: { type: string, enum: [auto, manual] }
        connection: { $ref: '#/components/schemas/Connection' }
        autoRule: { type: [string, 'null'], description: '自動制御の状態（例 "On when DO < 5.0"）' }
        blockedCommands:
          type: array
          description: Safety Layer で禁止された操作と理由（UI でボタンを無効にして理由を示す）
          items:
            type: object
            required: [command, reason]
            properties:
              command: { $ref: '#/components/schemas/ActuatorCommand' }
              reason: { type: string }
        updatedAt: { type: string, format: date-time }

    ActuatorLog:
      type: object
      required: [id, actuatorId, command, at, by, result]
      properties:
        id: { type: string }
        actuatorId: { type: string }
        actuatorName: { type: string }
        command:
          type: string
          description: ActuatorCommand、または自動制御による auto_on / auto_off
        at: { type: string, format: date-time }
        by:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
          description: 自動制御の場合 null
        result: { type: string, enum: [succeeded, failed, blocked] }

    # ── Reports ──
    ReportListItem:
      type: object
      required: [id, type, farm, status]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/ReportType' }
        farm: { $ref: '#/components/schemas/FarmRef' }
        date: { type: string, format: date, description: Daily のみ }
        weekStart: { type: string, format: date, description: Weekly のみ }
        weekEnd: { type: string, format: date, description: Weekly のみ }
        technicalManager: { $ref: '#/components/schemas/UserRef' }
        status: { $ref: '#/components/schemas/ReportState' }
        issueCount: { type: integer }
        submittedAt: { type: [string, 'null'], format: date-time }
        dueAt: { type: string, format: date-time }
        savedAt: { type: [string, 'null'], format: date-time }

    Source:
      type: string
      description: 値の参照元（UI の「From records」等）
      enum: [records, alert_system, alert_handling, actuator_log, sensor_database, sampling, manual]

    DailyPondRow:
      type: object
      description: Ponds at a glance / Pond details の1行（センサー値は含めない）
      required: [pond]
      properties:
        pond: { $ref: '#/components/schemas/PondRef' }
        feedKg: { type: [number, 'null'], description: 'source: records' }
        feedRounds: { type: [integer, 'null'] }
        feedType: { type: [string, 'null'] }
        appetite: { $ref: '#/components/schemas/Appetite' }
        tray: { $ref: '#/components/schemas/TrayCondition' }
        mortalityPcs: { type: [integer, 'null'], description: 'source: records' }
        mortalityKg: { type: [number, 'null'] }
        abnormalMortality: { type: boolean }
        health: { $ref: '#/components/schemas/Severity' }
        observations:
          type: array
          items: { $ref: '#/components/schemas/HealthObservation' }
        healthNote: { type: string }
        aerators: { $ref: '#/components/schemas/OnCount' }
        pumps: { $ref: '#/components/schemas/OnCount' }
        alertLine: { type: [string, 'null'], description: その日の Alert の1行要約 }

    DailyReport:
      allOf:
        - $ref: '#/components/schemas/ReportListItem'
        - type: object
          required: [ponds, totals, alerts, actions, completeness]
          properties:
            previousReportId: { type: [string, 'null'] }
            nextReportId: { type: [string, 'null'] }
            completeness:
              type: object
              description: 上部のチェックリスト
              properties:
                feeding: { type: boolean }
                mortality: { type: boolean }
                equipment: { type: boolean }
                health: { type: boolean }
                weather: { type: boolean }
                summary: { type: boolean }
            ponds:
              type: array
              items: { $ref: '#/components/schemas/DailyPondRow' }
            totals:
              type: object
              description: Farm の合計（加算可能な値のみ）
              properties:
                feedKg: { type: number }
                mortalityPcs: { type: integer }
                mortalityKg: { type: number }
                reducedAppetitePonds: { type: integer }
                leftoverTrayPonds: { type: integer }
                healthAttentionPonds: { type: integer }
            environment:
              type: object
              properties:
                weather: { type: [string, 'null'], example: Cloudy }
                rainfallMm: { type: [number, 'null'] }
                events: { type: [string, 'null'] }
                generator: { type: [string, 'null'], example: 'Standby (tested 07:00)' }
            equipmentEvents:
              type: array
              items:
                type: object
                properties:
                  equipment: { type: string }
                  pond:
                    oneOf:
                      - $ref: '#/components/schemas/PondRef'
                      - type: 'null'
                  failure: { type: string }
                  occurredAt: { type: string, format: date-time }
                  action: { type: string }
                  status: { type: string, enum: [open, resolved] }
            alerts:
              type: array
              description: 'その日の Alert（source: alert_system）。TM が除外したものは excluded: true'
              items:
                allOf:
                  - $ref: '#/components/schemas/Alert'
                  - type: object
                    properties:
                      durationMinutes: { type: integer }
                      excluded: { type: boolean }
            actions:
              type: array
              items: { $ref: '#/components/schemas/ReportAction' }
            summary: { type: [string, 'null'], description: Technical Manager Summary（提出に必須） }

    ReportAction:
      type: object
      required: [id, source, action]
      properties:
        id: { type: string }
        source:
          type: string
          enum: [alert_handling, actuator_log, manual]
        at: { type: string, format: date-time }
        pond:
          oneOf:
            - $ref: '#/components/schemas/PondRef'
            - type: 'null'
        action: { type: string }
        outcome: { type: [string, 'null'] }

    DailyReportInput:
      type: object
      description: TM が入力する項目のみ（記録から集めた値はここでは変えない）
      properties:
        ponds:
          type: array
          items:
            type: object
            required: [pondId]
            properties:
              pondId: { type: string }
              appetite: { $ref: '#/components/schemas/Appetite' }
              tray: { $ref: '#/components/schemas/TrayCondition' }
              health: { $ref: '#/components/schemas/Severity' }
              observations:
                type: array
                items: { $ref: '#/components/schemas/HealthObservation' }
              healthNote: { type: string }
        environment:
          type: object
          properties:
            weather: { type: string }
            rainfallMm: { type: number }
            events: { type: string }
            generator: { type: string }
        excludedAlertIds:
          type: array
          items: { type: string }
        manualActions:
          type: array
          description: 手入力の対応（Add action）。全件を送る（置き換え）
          items:
            type: object
            required: [action]
            properties:
              id: { type: string, description: 既存の手入力を更新する場合 }
              at: { type: string, format: date-time }
              pondId: { type: [string, 'null'] }
              action: { type: string }
              outcome: { type: string }
        summary: { type: string }

    WeeklyReport:
      allOf:
        - $ref: '#/components/schemas/ReportListItem'
        - type: object
          properties:
            summary:
              type: object
              properties:
                farmStatus: { $ref: '#/components/schemas/Severity' }
                pondsBehind: { type: integer }
                feedKg: { type: number }
                mortalityPcs: { type: integer }
                mainIssues:
                  type: array
                  items: { type: string }
            samplingCoverage:
              type: object
              description: 週次サンプリングの測定状況
              properties:
                sampled: { type: integer }
                total: { type: integer }
                notSampled:
                  type: array
                  items: { $ref: '#/components/schemas/PondRef' }
            production: { $ref: '#/components/schemas/FarmProduction' }
            feeding: { $ref: '#/components/schemas/WeeklyTotalByPond' }
            mortality: { $ref: '#/components/schemas/WeeklyTotalByPond' }
            pondsThisWeek:
              type: array
              items: { $ref: '#/components/schemas/WeeklyPondRow' }
            alerts:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Alert'
                  - type: object
                    properties:
                      durationMinutes: { type: integer }
                      cause: { type: [string, 'null'] }
                      action: { type: [string, 'null'] }
                      outcome: { type: [string, 'null'] }
            majorActions:
              type: array
              items: { $ref: '#/components/schemas/ReportAction' }
            waterQualityComment: { type: [string, 'null'] }
            technicalSummary: { type: [string, 'null'], description: Weekly Technical Summary（提出に必須） }

    WeeklyTotalByPond:
      type: object
      description: 週合計と前週比、Pond 別の内訳（全 Pond・Others にまとめない）
      properties:
        total: { type: number }
        previousTotal: { type: [number, 'null'] }
        byPond:
          type: array
          items:
            type: object
            properties:
              pond: { $ref: '#/components/schemas/PondRef' }
              value: { type: number }
              dailyAverage: { type: number }
              per10kStocked: { type: [number, 'null'], description: 死亡のみ・放養1万尾あたり }
              peakDate: { type: [string, 'null'], format: date, description: 死亡のみ・最多の日 }
              reducedAppetiteDays: { type: [integer, 'null'], description: 給餌のみ }

    WeeklyPondRow:
      type: object
      description: Ponds this week のタブ（growth / wq / feed / lab）を1行にまとめたもの
      required: [pond]
      properties:
        pond: { $ref: '#/components/schemas/PondRef' }
        growth: { $ref: '#/components/schemas/PondProduction' }
        waterQuality:
          type: object
          description: 'Sensor Database から週次で自動集計（source: sensor_database）。平均は出さない'
          properties:
            doMin: { type: [number, 'null'] }
            phMin: { type: [number, 'null'] }
            phMax: { type: [number, 'null'] }
            temperatureMax: { type: [number, 'null'] }
            outOfRangeDays: { type: integer }
            alertCount: { type: integer }
            trend: { $ref: '#/components/schemas/Trend' }
            worst: { $ref: '#/components/schemas/Severity' }
        laboratory:
          type: object
          properties:
            sampledOn: { type: [string, 'null'], format: date }
            pending: { type: boolean }
            tan: { type: [number, 'null'] }
            no2: { type: [number, 'null'] }
            vibrio: { type: [number, 'null'] }
            alkalinity: { type: [number, 'null'] }

    WeeklyReportInput:
      type: object
      properties:
        alertNotes:
          type: array
          items:
            type: object
            required: [alertId]
            properties:
              alertId: { type: string }
              cause: { type: string }
              action: { type: string }
              outcome: { type: string }
        waterQualityComment: { type: string }
        laboratoryConfirmed: { type: boolean }
        technicalSummary: { type: string }

    # ── Admin ──
    AdminUser:
      type: object
      required: [id, name, email, role, status]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        farm:
          oneOf:
            - $ref: '#/components/schemas/FarmRef'
            - type: 'null'
        language: { $ref: '#/components/schemas/Language' }
        status: { $ref: '#/components/schemas/UserStatus' }
        invitedAt: { type: [string, 'null'], format: date-time }
        invitationExpiresAt: { type: [string, 'null'], format: date-time }
        lastSignInAt: { type: [string, 'null'], format: date-time }
        canDeactivate: { type: boolean, description: 自分自身・最後の SA は false }
        canChangeRole: { type: boolean }

    AdminFarmInput:
      type: object
      required: [name, location]
      properties:
        name: { type: string }
        location: { type: string }
        timeZone: { type: string, default: Asia/Jakarta }
        status: { type: string, enum: [active, inactive] }

    AdminFarm:
      allOf:
        - $ref: '#/components/schemas/AdminFarmInput'
        - type: object
          required: [id]
          properties:
            id: { type: string }
            pondCount: { type: integer }
            pondsInOperation: { type: integer }
            technicalManagers:
              type: array
              items: { $ref: '#/components/schemas/UserRef' }
            devicesOnline: { type: integer }
            devicesTotal: { type: integer }

    AdminPondInput:
      type: object
      required: [name, areaHa]
      properties:
        name: { type: string }
        areaHa: { type: number, exclusiveMinimum: 0 }
        status: { type: string, enum: [in_operation, fallow] }

    AdminPond:
      allOf:
        - $ref: '#/components/schemas/AdminPondInput'
        - type: object
          required: [id]
          properties:
            id: { type: string }
            sensorCount: { type: integer }
            actuatorCount: { type: integer }

    AdminDeviceInput:
      type: object
      required: [deviceId, type, pondId]
      properties:
        deviceId: { type: string, example: A-P02-DO }
        type: { $ref: '#/components/schemas/DeviceType' }
        pondId: { type: string }
        parameter:
          description: センサーのみ
          oneOf:
            - $ref: '#/components/schemas/SensorParameter'
            - type: 'null'

    AdminDevice:
      allOf:
        - $ref: '#/components/schemas/AdminDeviceInput'
        - type: object
          required: [connection]
          properties:
            pond: { $ref: '#/components/schemas/PondRef' }
            connection: { $ref: '#/components/schemas/Connection' }
            lastSeenAt: { type: [string, 'null'], format: date-time }

    SettingsMeta:
      type: object
      properties:
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: '#/components/schemas/UserRef' }

    ThresholdSettings:
      allOf:
        - $ref: '#/components/schemas/SettingsMeta'
        - type: object
          required: [items]
          properties:
            farmId: { type: [string, 'null'], description: null = 全 Farm 共通の初期値 }
            items:
              type: array
              items: { $ref: '#/components/schemas/Threshold' }

    GrowthTargetSettings:
      allOf:
        - $ref: '#/components/schemas/SettingsMeta'
        - type: object
          required: [points, onTrackBandPct]
          properties:
            points:
              type: array
              items: { $ref: '#/components/schemas/GrowthTargetPoint' }
            onTrackBandPct: { type: number }

    RuleSettingsInput:
      type: object
      properties:
        dailyReportDue: { type: string, description: '当日の締切時刻 HH:mm（WIB）', example: '18:00' }
        weeklyReportDueWeekday: { type: integer, minimum: 1, maximum: 7, description: 翌週の曜日（1 = 月曜） }
        sensorDelayedAfterMinutes: { type: integer, example: 15 }
        sensorOfflineAfterMinutes: { type: integer, example: 60 }
        attentionToAlertMinutes: { type: integer, example: 30 }
        productionAttentionPct: { type: number, example: 25 }
        productionWarningPct: { type: number, example: 50 }

    RuleSettings:
      allOf:
        - $ref: '#/components/schemas/SettingsMeta'
        - $ref: '#/components/schemas/RuleSettingsInput'
